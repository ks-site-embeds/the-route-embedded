<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamben Signal — Testimonial background</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#CEDDD2;overflow:hidden}
svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.mob{display:none}
@media (max-width:759px){.desk{display:none}.mob{display:block}}
</style>
</head>
<body>
<!-- Desktop composition, 1440×735 design space. preserveAspectRatio "slice" = cover: scales to fill the frame at ANY width/height,
     cropping top/bottom instead of distorting, so the orange wedge always meets the left edge. ?fit=stretch distorts instead of cropping. -->
<svg class="desk" viewBox="0 0 1440 735" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <polygon class="wedge" points="0,0 256,0 119,735 0,735" fill="#FF6932"></polygon>
  <g class="shape"><path d="M 211.000 248.595 L 513.004 75.166 L 873.063 -214.769 L 890.740 -229.000 L 920.778 -211.009 L 1140.060 56.770 L 1290.427 324.896 L 1527.154 690.208 L 1670.358 833.613 L 1796.000 1020.000 L 797.215 1020.000 L 450.674 603.956 L 345.250 425.321 L 211.000 248.595 Z" fill="#FEFBF4"></path></g>
</svg>
<svg class="mob" viewBox="0 0 390 540" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <polygon class="wedge" points="0,0 58,0 24,540 0,540" fill="#FF6932"></polygon>
  <g class="shape"><polygon points="72,64 390,0 390,476 38,540" fill="#FEFBF4"></polygon></g>
</svg>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get('bg')) document.documentElement.style.background = document.body.style.background = '#' + q.get('bg').replace('#', '');
  if (q.get('fit') === 'stretch') document.querySelectorAll('svg').forEach(function (s) { s.setAttribute('preserveAspectRatio', 'none'); });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var E = 'cubic-bezier(.22,.61,.36,1)', shapes = document.querySelectorAll('.shape'), wedges = document.querySelectorAll('.wedge');
  shapes.forEach(function (s) { s.style.opacity = '0'; s.style.transform = 'translateY(24px)'; });
  wedges.forEach(function (w) { w.style.clipPath = 'inset(0 0 100% 0)'; });
  function play() {
    shapes.forEach(function (s) { s.animate([{ opacity: 0, transform: 'translateY(24px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 1100, fill: 'forwards', easing: E }); });
    wedges.forEach(function (w) { w.animate([{ clipPath: 'inset(0 0 100% 0)' }, { clipPath: 'inset(0 0 0% 0)' }], { duration: 1200, delay: 150, fill: 'forwards', easing: E }); });
  }
  var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { io.disconnect(); play(); } }); }, { threshold: 0.25 });
  io.observe(document.body);
})();
</script>
</body>
</html>
